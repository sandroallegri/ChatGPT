<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report video YouTube nei bookmark</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Video YouTube nei bookmark</h1>
      <p id="summary">Premi “Scansiona bookmark” per iniziare.</p>
      <div class="toolbar">
        <button id="scan" type="button">Scansiona bookmark</button>
        <button id="export" type="button" disabled>Esporta HTML</button>
      </div>
    </header>

    <section id="status" role="status" aria-live="polite"></section>

    <table>
      <thead>
        <tr>
          <th>Attivo</th>
          <th>Nome video</th>
          <th>Autore</th>
          <th>Visualizzazioni</th>
        </tr>
      </thead>
      <tbody id="results">
        <tr><td colspan="4" class="empty">Nessun risultato.</td></tr>
      </tbody>
    </table>

    <script src="report.js"></script>
  </body>
</html>
